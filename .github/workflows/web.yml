# Builds the Pluma web client (Telegram Web K) from the upstream commit
# upstream.env pins.
#
#   check  the patch script's tests, on the pinned upstream too (the patch
#          applies, and damage to any of its places stops it), and the shell
#          scripts' lint;
#   build  fetch, patch, typecheck and bundle (the pnpm store in the GitHub
#          Actions cache), check the bundle for traces of Telegram's servers,
#          and the archive of the site with its SHA-256;
#   image  for a build for the server, on main: the image the server runs,
#          ghcr.io/<owner>/pluma-web:<commit> (Caddy with the site; the
#          server repository brings the Caddyfile).
#
# The site is not encrypted: it is the static content the server's web site
# serves to anyone anyway (README).
#
# The weekly run is a canary: it builds the pinned upstream on a fresh runner
# image, so a broken toolchain or dependency shows up before an update is
# needed.
name: web

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch upstream
        run: ci/fetch-upstream.sh
      - name: Patch script tests
        run: python3 -I ci/patch_test.py -v
      - name: Shell scripts
        run: shellcheck -x ci/*.sh e2e/*.sh brand/*.sh

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      target: ${{ steps.configure.outputs.target }}
      site: ${{ steps.build.outputs.site }}
    env:
      pnpm_config_store_dir: ${{ github.workspace }}/.pnpm-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain of upstream.env
        id: toolchain
        run: |
          . ./upstream.env
          echo "node=$NODE_VERSION" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          package-manager-cache: false
      - name: pnpm
        run: ci/setup.sh
      - name: Fetch upstream
        run: ci/fetch-upstream.sh
      - name: Patch
        id: configure
        env:
          SERVER_URL: ${{ vars.PLUMA_SERVER_URL }}
          RSA_PUBLIC_KEY: ${{ vars.PLUMA_RSA_PUBLIC_KEY }}
        run: ci/configure.sh
      - name: Restore the pnpm store
        id: pnpm-store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('upstream/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Build
        id: build
        env:
          TARGET: ${{ steps.configure.outputs.target }}
        run: ci/build.sh "$TARGET"
      - name: Save the pnpm store
        if: always() && steps.pnpm-store.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('upstream/pnpm-lock.yaml') }}
      - name: Upload the site
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.site }}
          path: |
            out/${{ steps.build.outputs.site }}.tar.gz
            out/${{ steps.build.outputs.site }}.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error

  image:
    needs: build
    if: needs.build.outputs.target == 'server' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.site }}
          path: out
      - name: The site
        env:
          SITE: ${{ needs.build.outputs.site }}
        run: |
          cd out && sha256sum -c "$SITE.tar.gz.sha256" && cd ..
          mkdir site
          tar -xzf "out/$SITE.tar.gz" -C site --strip-components=1
          test -f site/index.html
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: site
          file: ci/site.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/pluma-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
